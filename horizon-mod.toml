id = "buildinggadgets2"
name = "Building Gadgets 2"
version = "0.2.9"
description = """A port of Building Gadgets 2 for Horizon. The building gadget's item, recipe, selection
(sneak + right click stores the clicked block's state in the item's buildinggadgets2:gadget_state
component) and all eight modes (build-to-me, vertical wall, vertical column, surface, horizontal
wall, stairs, horizontal row, grid) with the 1..15 range, /buildinggadgets2 mode|range|placeontop
and the mouse-wheel range step are ported. A sneak click stores upstream's cleaned state
(GadgetUtils.cleanBlockState): a transient property (a crop's age, a furnace's lit, a door's open,
...) is stored at the block's default while the orientation ones (facing, axis, hinge, powered,
shape, ...) are carried over, and /buildinggadgets2 names the stored state string. The mod's own
buildinggadgets2:deny block tag is carried and read: a sneak click on one of its members answers
Invalid Block, and a build destination whose block the tag names is refused. The destruction
gadget is also carried: its item, recipe and a sneak-click destination PLAN (a single layer at the
clicked block's height, +/-range on x and z). The plan refuses air, an unbreakable block
(destroy speed < 0), a deny-tag member and — where the pin has no stamped block-class query —
records `blocked(no-render-block-surface)` for upstream's RenderBlock clause only. The plan is
stored on the stack and /buildinggadgets2 names its cell count; it removes nothing. The exchange
gadget is also carried (`gadget_exchanging`, the jar's item id): its item, recipe and a sneak-click
destination PLAN on the same one-layer rule, refusing air, an unbreakable block and a deny-tag
member with the three stamped queries. The plan is stored on that stack and named by
/buildinggadgets2 with 0 placed and 0 removed. The Copy/Paste gadget is also carried under
the jar's item id `gadget_copy_paste` (`GadgetCopyPaste` is only the Java class): its item,
recipe and a sneak-click Copy-mode destination collection on the same one-layer rule, refusing
air, an unbreakable block and a deny-tag member with the three stamped queries. Upstream's
RenderBlock clause is recorded `blocked(no-render-block-surface)`; the collected count is named
by /buildinggadgets2 with 0 placed and 0 removed. The build, the swap and the paste itself are
HELD: the SDK has no placement call that names the acting player and lets a protection
mod cancel one position, so a click writes no block and spends no item, and says so on the action
bar with the symbol `blocked: no-cancellable-placement`. Every destination also passes the
player's own placement gate (build permission, mayUseItemAt, the world border with its exclusive
upper edges, and a dedicated server's spawn protection). The anchor, undo, energy, the block
removal the destruction plan precedes, the real paste with its block-entity data copy, the rotate
and cut gadgets and their screens are not ported yet."""
authors = ["Direwolf20-MC", "AdLf0208"]
# Licence of the original (MIT, Direwolf20-MC/BuildingGadgets2); the text and the
# original copyright notice travel inside the package as LICENSE / LICENSE-NOTICE.md.
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: the gadget's builder runs on the server, and
# the mouse-wheel range step is a client hook, so single player (an integrated server) and a
# dedicated server both need the package.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"): this mod declares the gadget item, its recipe/tab and its item component.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
