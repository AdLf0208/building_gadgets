id = "buildinggadgets2"
name = "Building Gadgets 2"
version = "0.2.3"
description = """A port of Building Gadgets 2 for Horizon: the building gadget with all eight of its modes.
Sneak + right click selects the clicked block's state; a plain right click builds in the selected mode
(build-to-me, vertical wall, vertical column, surface, horizontal wall, stairs, horizontal row or grid),
bounded by the tool range (1..15, set with /buildinggadgets2 range or the mouse wheel) and by
/buildinggadgets2 mode, skipping cells that are not replaceable, and paying one item of the block's kind
per placed cell. /buildinggadgets2 placeontop toggles the PLACE_ON_TOP setting. The anchor, undo, energy,
and the paste/rotate/cut/destruction/exchange gadgets and their screens are not ported yet."""
authors = ["Direwolf20-MC", "AdLf0208"]
# Licence of the original (MIT, Direwolf20-MC/BuildingGadgets2); the text and the
# original copyright notice travel inside the package as LICENSE / LICENSE-NOTICE.md.
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: the gadget's builder runs on the server, and
# the mouse-wheel range step is a client hook, so single player (an integrated server) and a
# dedicated server both need the package.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"): this mod declares the gadget item, its recipe/tab and its item component.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
